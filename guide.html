<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>anon&mato · field guide</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #111;
        --text: #eee;
        --line: color-mix(in srgb, var(--text) 14%, transparent);
        --line2: color-mix(in srgb, var(--text) 28%, transparent);
        --card: color-mix(in srgb, var(--text) 4%, transparent);
      }
      :root[data-theme="light"] {
        --surface: #f2f1ee;
        --text: #1b1b1b;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.55;
        background: var(--surface);
        color: var(--text);
        padding: 28px 24px 80px;
      }
      main {
        display: grid;
        gap: 34px;
        max-width: 1040px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      h1 small {
        opacity: 0.5;
        font-size: 12px;
        font-weight: 400;
        margin-left: 12px;
      }
      h2 {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.55;
        margin: 0 0 2px;
      }
      section {
        display: grid;
        gap: 12px;
      }
      p {
        margin: 0;
        max-width: 68ch;
      }
      .lead {
        opacity: 0.85;
      }
      .muted {
        opacity: 0.6;
      }
      b {
        font-weight: 600;
      }
      code {
        font: 13px ui-monospace, monospace;
        background: var(--card);
        padding: 1px 5px;
        border-radius: 4px;
      }
      /* the loop strip */
      .loop {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        gap: 6px;
      }
      .loop .node {
        flex: 1 1 130px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        padding: 10px 12px;
      }
      .loop .node b {
        display: block;
        font-size: 15px;
      }
      .loop .node span {
        font-size: 13px;
        opacity: 0.65;
      }
      .loop .arr {
        align-self: center;
        opacity: 0.4;
        font-size: 20px;
      }
      /* tables */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th {
        text-align: left;
        font-weight: 600;
        font-size: 12px;
        opacity: 0.5;
        padding: 7px 10px;
        border-bottom: 1px solid var(--line2);
        white-space: nowrap;
      }
      td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: none;
      }
      .dots {
        display: inline-flex;
        gap: 3px;
      }
      .wt {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--line2);
      }
      .wt.on {
        background: var(--text);
        opacity: 0.75;
      }
      .bar {
        position: relative;
        height: 6px;
        min-width: 70px;
        border-radius: 4px;
        background: var(--card);
        border: 1px solid var(--line);
      }
      .bar > span {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 4px;
        background: color-mix(in srgb, var(--text) 55%, transparent);
      }
      /* card grids */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 12px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        padding: 14px;
        display: grid;
        gap: 8px;
      }
      .card h3 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card .who {
        font-size: 12px;
        opacity: 0.55;
      }
      .pill {
        display: inline-block;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line2);
        white-space: nowrap;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
      }
      .eff {
        font-size: 13px;
        opacity: 0.85;
      }
      .callout {
        border: 1px solid var(--line2);
        border-radius: 12px;
        padding: 14px 16px;
        display: grid;
        gap: 8px;
      }
      .callout .chain {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        font-size: 14px;
      }
      /* ── the plan / vision ── */
      .roadmap {
        margin-top: 8px;
        border-top: 1px dashed var(--line2);
        padding-top: 30px;
        display: grid;
        gap: 10px;
      }
      .roadmap h1 {
        margin: 8px 0 0;
      }
      .tag {
        justify-self: start;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px dashed var(--line2);
        opacity: 0.7;
      }
      .wheel {
        margin: 2px auto 0;
        max-width: 540px;
        width: 100%;
      }
      .wheel svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .wlab {
        fill: #161616;
        paint-order: stroke;
        stroke: #fff;
        stroke-width: 3px;
        stroke-linejoin: round;
        font-family: system-ui, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
      .wcore {
        fill: #4a4a4a;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
      .wcore2 {
        fill: #7a7a7a;
        font-family: system-ui, sans-serif;
        font-size: 11px;
      }
      .pillars {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
      }
      .pillar {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        padding: 14px;
        display: grid;
        gap: 8px;
        align-content: start;
      }
      .pillar h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hue {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        flex: none;
      }
      .chain2 {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }
      .chain2 .sep {
        opacity: 0.35;
      }
      .tnode {
        border-top: 1px solid var(--line);
        padding-top: 8px;
        display: grid;
        gap: 3px;
      }
      .tnode.root {
        border-top: none;
        padding-top: 0;
      }
      .trow {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .trow b {
        font-size: 15px;
      }
      .tmeta {
        font-size: 13px;
        opacity: 0.6;
      }
      .teff {
        font-size: 13px;
        opacity: 0.85;
      }
      .badge {
        font-size: 12px;
        letter-spacing: 0.03em;
        padding: 1px 8px;
        border-radius: 999px;
        border: 1px solid var(--line2);
        opacity: 0.7;
      }
      #theme {
        position: fixed;
        right: 14px;
        bottom: 14px;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 18px;
        opacity: 0.55;
        cursor: pointer;
      }
      #theme:hover {
        opacity: 1;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main id="guide"></main>
    <button id="theme" aria-label="Toggle light/dark"></button>
    <script type="module" src="./lib/guide.js"></script>
  </body>
</html>
