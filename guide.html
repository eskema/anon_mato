<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>anon & mato · field guide</title>
    <!-- the game's chrome: its face, its paper, its boxes -->
    <link rel="stylesheet" href="./lib/chrome.css" />
    <style>
      :root {
        --line: color-mix(in srgb, var(--text) 14%, transparent);
        --line2: color-mix(in srgb, var(--text) 28%, transparent);
        --card: color-mix(in srgb, var(--text) 4%, transparent);
      }
      html,
      body {
        margin: 0;
      }
      /* prose in the regular cut; the semibold for names, heads and numbers */
      body {
        font-weight: 400;
        line-height: 1.55;
        padding: 28px 24px 80px;
      }
      main {
        display: grid;
        gap: 34px;
        max-width: 1040px;
        margin: 0 auto;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      h1 small {
        color: var(--dim);
        font-size: 16px;
        font-weight: 400;
        margin-left: 12px;
      }
      h2 {
        font-size: 16px;
        font-weight: 600;
        color: var(--dim);
        margin: 0 0 2px;
      }
      section {
        display: grid;
        gap: 12px;
      }
      p {
        margin: 0;
        max-width: 68ch;
      }
      .lead {
        opacity: 0.85;
      }
      .muted {
        color: var(--dim);
      }
      b {
        font-weight: 600;
      }
      code {
        font: inherit;
        font-weight: 600;
        background: var(--card);
        padding: 0 4px;
      }
      /* the loop strip */
      .loop {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        gap: 6px;
      }
      .loop .node {
        flex: 1 1 130px;
        border: 1px solid var(--line);
        background: var(--card);
        padding: 10px 12px;
      }
      .loop .node b {
        display: block;
      }
      .loop .node span {
        color: var(--dim);
      }
      .loop .arr {
        align-self: center;
        color: var(--dim);
      }
      /* tables */
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-weight: 600;
        color: var(--dim);
        padding: 7px 10px;
        border-bottom: 1px solid var(--line2);
        white-space: nowrap;
      }
      td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: none;
      }
      .dots {
        display: inline-flex;
        gap: 3px;
      }
      .wt {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--line2);
      }
      .wt.on {
        background: var(--text);
        opacity: 0.75;
      }
      .bar {
        position: relative;
        height: 6px;
        min-width: 70px;
        background: var(--card);
        border: 1px solid var(--line);
      }
      .bar > span {
        position: absolute;
        inset: 0 auto 0 0;
        background: color-mix(in srgb, var(--text) 55%, transparent);
      }
      /* card grids */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 12px;
      }
      .card {
        border: 1px solid var(--line);
        background: var(--card);
        padding: 14px;
        display: grid;
        gap: 8px;
      }
      .card h3 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card .who {
        color: var(--dim);
      }
      .pill {
        display: inline-block;
        padding: 0 8px;
        border: 1px solid var(--line2);
        white-space: nowrap;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
      }
      .eff {
        opacity: 0.85;
      }
      .callout {
        border: 1px solid var(--line2);
        padding: 14px 16px;
        display: grid;
        gap: 8px;
      }
      .callout .chain {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      /* ── the plan / vision ── */
      .roadmap {
        margin-top: 8px;
        border-top: 1px dashed var(--line2);
        padding-top: 30px;
        display: grid;
        gap: 10px;
      }
      .roadmap h1 {
        margin: 8px 0 0;
      }
      .tag {
        justify-self: start;
        font-weight: 600;
        padding: 0 8px;
        border: 1px dashed var(--line2);
        color: var(--dim);
      }
      .wheel {
        margin: 2px auto 0;
        max-width: 540px;
        width: 100%;
      }
      .wheel svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .wlab {
        fill: #161616;
        paint-order: stroke;
        stroke: #fff;
        stroke-width: 3px;
        stroke-linejoin: round;
        font-family: var(--font);
        font-weight: 600;
        font-size: 13px;
      }
      .wcore {
        fill: #4a4a4a;
        font-family: var(--font);
        font-size: 13px;
        font-weight: 600;
      }
      .wcore2 {
        fill: #7a7a7a;
        font-family: var(--font);
        font-size: 11px;
      }
      .pillars {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
      }
      .pillar {
        border: 1px solid var(--line);
        background: var(--card);
        padding: 14px;
        display: grid;
        gap: 8px;
        align-content: start;
      }
      .pillar h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hue {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        flex: none;
      }
      .tnode {
        border-top: 1px solid var(--line);
        padding-top: 8px;
        display: grid;
        gap: 3px;
      }
      .tnode.root {
        border-top: none;
        padding-top: 0;
      }
      .trow {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .tmeta {
        color: var(--dim);
      }
      .teff {
        opacity: 0.85;
      }
      .badge {
        padding: 0 8px;
        border: 1px solid var(--line2);
        color: var(--dim);
      }
    </style>
  </head>
  <body class="chrome">
    <main id="guide"></main>
    <script type="module" src="./lib/guide.js"></script>
  </body>
</html>
