<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>anon & mato — world dev view</title>
  <style>
    :root {
      --surface: #f2f1ee;
      --text: #1b1b1b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #111;
        --text: #eee;
      }
    }
    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--surface);
      color: var(--text);
      font: 600 16px system-ui, sans-serif;
      overflow: hidden;
    }
    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 2;
      display: grid;
      gap: 8px;
      background: color-mix(in srgb, var(--surface) 84%, transparent);
      padding: 10px 12px;
      border-radius: 8px;
    }
    #ui label {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #key {
      font: 12px ui-monospace, monospace;
      max-width: 340px;
      word-break: break-all;
      opacity: 0.65;
      font-weight: 400;
    }
    #legend {
      position: fixed;
      bottom: 10px;
      left: 10px;
      z-index: 2;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
      background: color-mix(in srgb, var(--surface) 84%, transparent);
      padding: 8px 12px;
      border-radius: 8px;
    }
    #legend label {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }
    button,
    input {
      font: inherit;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div style="display: flex; gap: 10px; align-items: center">
      <button id="rnd">randomize world</button>
    </div>
    <div id="hint" style="font-weight: 400; font-size: 13px; opacity: 0.8; max-width: 340px">
      click a tile to stand there and shade its reach
    </div>
    <div id="key"></div>
  </div>
  <div id="legend"></div>
  <canvas id="cv"></canvas>
  <script type="module" src="./lib/worldview.js"></script>
</body>
</html>
