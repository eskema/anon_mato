<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>anon & mato — world dev view</title>
  <!-- the game's chrome: its face, its paper, its boxes -->
  <link rel="stylesheet" href="./lib/chrome.css" />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    /* the panels: plain paper standing off the corners as the game's chrome
       does, only the controls boxed */
    #ui {
      position: fixed;
      top: 6px;
      left: 6px;
      z-index: 2;
      display: grid;
      gap: 6px;
      justify-items: start;
      padding: 6px;
      background: var(--surface);
    }
    #ui .row {
      display: grid;
      grid-auto-flow: column;
      gap: 12px;
      align-items: center;
    }
    #ui label {
      display: grid;
      grid-auto-flow: column;
      gap: 6px;
      align-items: center;
    }
    #ui input[type="number"] {
      width: 4.5em;
    }
    #hint {
      font-weight: 400;
      opacity: 0.8;
      max-width: 340px;
    }
    #key {
      font-weight: 400;
      color: var(--dim);
      max-width: 340px;
      word-break: break-all;
    }
    #legend {
      position: fixed;
      bottom: 6px;
      left: 6px;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      padding: 6px;
      background: var(--surface);
    }
    #legend > span:first-child {
      color: var(--dim);
    }
    #legend label {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    #legend label.off {
      color: var(--faint);
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }
  </style>
</head>
<body class="chrome">
  <div id="ui">
    <div class="row">
      <button id="rnd">new world</button>
      <label>angle <input id="angle" type="number" min="0" max="359" step="1" /></label>
    </div>
    <label>reach budget <input id="budget" type="number" min="1" step="1" /> min</label>
    <div id="hint">
      click a tile to stand there and shade its rough reach — terrain step costs only (no walls, river rules or leaps)
    </div>
    <div id="key"></div>
  </div>
  <div id="legend"></div>
  <canvas id="cv"></canvas>
  <script type="module" src="./lib/worldview.js"></script>
</body>
</html>
