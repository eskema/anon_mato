<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>anon&amp;mato</title>
  <!-- the face is fetched at parse time, before anything asks for it: nothing
       should ever be typed twice, once in a fallback and once for real -->
  <link rel="preload" href="./fonts/SourceCodePro-Semibold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/SourceCodePro-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* THE GAME FACE — Source Code Pro, shipped with the game (fonts/, two
       weights). Everything the game draws is typed in it, canvas included, so
       the boxes and their columns line up by the letterform rather than by any
       measuring we do. `swap` so the first frame is never blank; main.js
       redraws once the real face lands. */
    @font-face {
      font-family: "Source Code Pro";
      src: url("./fonts/SourceCodePro-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: "Source Code Pro";
      src: url("./fonts/SourceCodePro-Semibold.woff2") format("woff2");
      font-weight: 600;
      font-display: block;
    }
    :root {
      color-scheme: light dark;
      --surface: #111;
      --text: #eee;
      --font: "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    :root[data-theme="light"] {
      --surface: #f2f1ee;
      --text: #1b1b1b;
    }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      /* BLACK under the canvas — whatever shows past the world (overscroll, a
         canvas that hasn't sized yet) is void, not paper */
      background: #000;
      color: var(--text);
    }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* boot loader — painted immediately, hidden once the world is ready */
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 20px;
      background: var(--surface);
      color: var(--text);
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    #loading .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      opacity: 0.55;
      animation: spin 0.8s linear infinite;
    }
    #loading .load-msg { font-size: 16px; opacity: 0.7; }
    #loading .load-track {
      width: 180px;
      height: 4px;
      border-radius: 2px;
      background: color-mix(in srgb, var(--text) 15%, transparent);
      overflow: hidden;
    }
    #loading #load-bar {
      height: 100%;
      width: 0%;
      background: currentColor;
      opacity: 0.55;
      border-radius: 2px;
      transition: width 0.12s linear;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div class="load-msg">Loading your world…</div>
    <div class="load-track"><div id="load-bar"></div></div>
  </div>
  <script type="module" src="./lib/main.js"></script>
</body>
</html>
